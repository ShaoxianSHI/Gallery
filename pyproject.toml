[project]
name = "gallery"
version = "0.0.1"
description = "本地优先的相册软件：照片留在你自己的文件夹里，软件只是它的一个视图"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyside6>=6.8",
    "pillow>=11.0",
    "pillow-heif>=1.0",
    "watchdog>=6.0",
]

[project.scripts]
gallery = "gallery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
]
# 打包工具：把源码编译成自包含的 Gallery.app（见 scripts/build_app.py）。
# 单独成组而不是并进 dev —— 它只在打包时用到，还会拖一堆编译期依赖（clang、
# 下载辅助工具等），不该拖慢日常的 `uv sync`。
build = [
    "nuitka>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gallery"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/gallery/core"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
