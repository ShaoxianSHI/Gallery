[project]
name = "gallery"
version = "0.0.1"
description = "本地优先的相册软件：照片留在你自己的文件夹里，软件只是它的一个视图"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyside6>=6.8",
    "pillow>=11.0",
    "pillow-heif>=1.0",
    "watchdog>=6.0",
]

[project.scripts]
gallery = "gallery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # 让测试默认并行跑：串行一轮 19s，分进程并行约 5s（见 addopts 处的说明）。
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "mypy>=1.14",
]
# 打包工具：把源码编译成自包含的 Gallery.app（见 scripts/build_app.py）。
# 单独成组而不是并进 dev —— 它只在打包时用到，还会拖一堆编译期依赖（clang、
# 下载辅助工具等），不该拖慢日常的 `uv sync`。
build = [
    "nuitka>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gallery"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# "N" 只为一件事：N802 命中的是 **Qt 覆写的方法名**（mousePressEvent、closeEvent…）。
#   本项目里 N802 只有这���个意思，所以打开它 —— 将来新写一个 Qt 覆写却忘了写
#   noqa，会当场被拦下，而不必等 reviewer 逐个看。
# "RUF022"：__all__ 按 isort 风格排序。排序过的清单让「少了谁」一眼看得出来
#   （menus.__all__ 就长期漏着它对外最要紧的 prepare）。
# 不开 "RUF" 整组：RUF001/002/003 是「易混淆的 Unicode 字符」，而这个仓库的
#   注释与文案全是中文，一开就是一万多条。
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF022"]

[tool.mypy]
python_version = "3.12"
files = ["src/gallery/core"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认分进程并行（`uv run pytest` 就是并行的，不必额外记参数）。
#
#   -n auto        进程数跟核心数走。实测一轮 20s → 4.8s。
#   --dist loadfile 一个测试文件整体交给同一个 worker，且保持文件内的声明顺序。
#                  选它而不是更快的 worksteal（4.1s）是有意的：界面测试里
#                  `qt_app` 是模块级 fixture，每个用例还有 `qt_teardown` 收尾，
#                  让一个文件待在同一个进程里，执行模型与串行时完全一致。
#                  那 0.7s 换「刚修完进程收尾崩溃之后执行模型不变」，值。
#
# 调试单个用例时想要串行、想要完整报错栈：`-n 0`（或 `-p no:xdist`）。
addopts = "-q --dist loadfile -n auto"
