[project]
name = "gallery"
version = "0.0.1"
description = "本地优先的相册软件：照片留在你自己的文件夹里，软件只是它的一个视图"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyside6>=6.8",
    "pillow>=11.0",
    "pillow-heif>=1.0",
    "watchdog>=6.0",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "pypinyin>=0.55.0",
]

[project.scripts]
gallery = "gallery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # 让测试默认并行跑（串行一轮 37s，并行约 9s）。
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "mypy>=1.14",
]
# 打包工具：把源码编译成自包含的 Gallery.app（见 scripts/build_app.py）。
# 单独成组是因为它只在打包时用到，还会拖一堆编译期依赖。
build = [
    "nuitka>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gallery"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# "N" 在本仓库只有一件事：N802 命中的是 Qt 覆写的方法名（mousePressEvent、
# closeEvent…），忘了写 noqa 会当场被拦下。
# "RUF022"：__all__ 按 isort 风格排序，排序过的清单让「少了谁」一眼看得出来。
# 不开 "RUF" 整组：RUF001/002/003 是「易混淆的 Unicode 字符」，而注释与文案全是中文。
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF022"]

[tool.mypy]
python_version = "3.12"
files = ["src/gallery/core"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认分进程并行（`uv run pytest` 就是并行的）。
#
#   -n auto         进程数跟核心数走（10 核实测一轮 37.4s → 8.8s）。
#   --dist loadfile 一个测试文件整体交给同一个 worker，保持文件内声明顺序 ——
#                   界面测试的 `qt_app` 是模块级 fixture，这样执行模型与串行一致。
#
# 代价是「最慢的那个文件就是这一轮的地板」：要提速先看 `--durations` 里最慢的文件。
# 调试单个用例想要串行与完整报错栈时用 `-n 0`。
addopts = "-q --dist loadfile -n auto"

# 后台线程里逃出去的异常一律当失败。
#
# 监听线程、去抖定时器、解码 worker 全在那边：异常在界面上的表现往往只是「某张图
# 一直不出来」，默认配置下没人会看见。写探针验证这条规则时记得 `join` 那个线程，
# 否则 pytest 收尾时那个异常对象还没被处理，看不出效果。
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
